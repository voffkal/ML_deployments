[pytest]
log_cli_level=WARNING

[tox]
min_version = 4
envlist = test_app, checks
skipsdist = True

[testenv]
install_command = pip install {opts} {packages}

passenv =
    GH_TOKEN
    MODEL_WHEEL

[testenv:test_app]
# MODEL_WHEEL points at the wheel downloaded from the model release. tox builds
# an isolated env, so a `pip install` outside it would not be visible here.
deps =
    -rtest_requirements.txt
    {env:MODEL_WHEEL:}

setenv =
    PYTHONPATH=.
    PYTHONHASHSEED=0

commands =
    pytest \
    -vv \
    {posargs:app/tests/}

[testenv:run1]
envdir = {toxworkdir}/test_app
deps =
    {[testenv:test_app]deps}

setenv =
    {[testenv:test_app]setenv}

commands =
    python app/main.py


[testenv:checks]
envdir = {toxworkdir}/checks
deps =
    -r{toxinidir}/typing_requirements.txt

commands =
    #flake8
    isort app
    black app
    {posargs: mypy app}

[flake8]
exclude = .git, __pycache__, __init__.py, .mypy_cache, .pytest_cache, .venv, alembic
max-line-length = 110