version: '2.1'

defaults: &defaults
  docker:
    - image: cimg/python:3.11.1
  working_directory: ~/project

install_gh: &install_gh
  run:
    name: Install GitHub CLI
    command: |
      # cimg/python does not ship gh, and publishing a model release needs it.
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
        | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
      sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
        | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
      sudo apt-get update -qq
      sudo apt-get install -y gh
      gh --version

prepare_tox: &prepare_tox
  run:
    name: Install tox
    command: |
      pip install --user tox

jobs:
  # The model package owns its own tests and runs them on every push, so a
  # broken model surfaces immediately rather than at release time.
  test_regression_model:
    <<: *defaults
    working_directory: ~/project/deploying_with_containers/model_package
    steps:
      - checkout:
          path: ~/project
      - *prepare_tox
      - run:
          name: Fetch the data
          command: tox -e fetch_data
      - run:
          name: Test the model
          command: tox

  test_titanic_model:
    <<: *defaults
    working_directory: ~/project/Titanic_dataset
    steps:
      - checkout:
          path: ~/project
      - *prepare_tox
      - run:
          name: Test the classification model
          command: tox

  test_app:
    <<: *defaults
    working_directory: ~/project/deploying_with_containers/houseprice_api
    steps:
      - checkout:
          path: ~/project
      - *install_gh
      - *prepare_tox
      - run:
          name: Install the model package from its GitHub Release
          command: |
            TAG=$(gh release list --json tagName -q '[.[].tagName | select(startswith("model-v"))][0]')
            [ -n "$TAG" ] || { echo "no model-v* release published yet"; exit 1; }
            echo "Using model release $TAG"
            gh release download "$TAG" -D model_pkg -p '*.whl' --clobber
            echo "export MODEL_WHEEL=$(ls $PWD/model_pkg/*.whl)" >> "$BASH_ENV"
      - run:
          name: Running app tests
          command: tox

  # Publishing is tag-only: a release is an explicit act, not a side effect
  # of pushing to main.
  publish_regression_model:
    <<: *defaults
    working_directory: ~/project/deploying_with_containers/model_package
    steps:
      - checkout:
          path: ~/project
      - *install_gh
      - *prepare_tox
      - run:
          name: Fetch the data
          command: tox -e fetch_data
      - run:
          name: Publish model package as a GitHub Release
          command: tox -e publish_model

tags_only: &tags_only
  filters:
    branches:
      ignore: /.*/
    tags:
      only: /^.*/

workflows:
  version: 2
  test-all:
    jobs:
      - test_regression_model
      - test_titanic_model
      - test_app

  release:
    jobs:
      - publish_regression_model:
          <<: *tags_only
